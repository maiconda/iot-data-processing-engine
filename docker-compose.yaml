version: '3.8'

services:
  nats:
    image: nats:alpine
    container_name: nats-jetstream
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-js -m 8222"

  telemetry-ingestor:
    build:
      context: telemetry-ingestor
    container_name: telemetry-ingestor
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats

  telemetry-data-generator:
    build:
      context: telemetry-data-generator
    container_name: telemetry-data-generator
    environment:
      - URL_INGESTOR=http://telemetry-ingestor:8080/telemetria
    depends_on:
      - telemetry-ingestor